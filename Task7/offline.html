<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Recipe Finder</title>
    <link rel="icon" type="image/svg+xml" href="/React26/Task7/favicon.svg" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fafafa;
        color: #111;
        line-height: 1.6;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        max-width: 420px;
        width: 100%;
        text-align: center;
      }

      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 24px;
        border-radius: 50%;
        background: #111;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
      }

      h1 { font-size: 1.5rem; margin-bottom: 12px; }

      p { color: #666; margin-bottom: 28px; }

      button {
        padding: 11px 24px;
        background: #111;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-family: inherit;
        font-size: 15px;
        cursor: pointer;
      }

      button:hover { background: #333; }

      .hint {
        margin-top: 24px;
        font-size: 13px;
        color: #999;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">!</div>
      <h1>You are offline</h1>
      <p>
        This page was not saved on your device, so it cannot be opened without
        a connection. Pages you visited earlier are still available.
      </p>
      <button type="button" id="retry">Retry connection</button>
      <p class="hint">Recipe Finder</p>
    </div>

    <script>
      document.getElementById("retry").addEventListener("click", () => {
        location.reload();
      });

      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
